name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x gh-dashboard tests/run.sh tests/lib.sh tests/test_*.sh tests/fake-bin/gh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is slow to start processes; Linux finishes in about a minute.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: bash 5 · macos: /bin/bash 3.2 · windows: Git Bash + jq.exe
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null; then
            case "$RUNNER_OS" in
              Linux)   sudo apt-get update && sudo apt-get install -y jq ;;
              macOS)   brew install jq ;;
              Windows) choco install jq -y ;;
            esac
          fi
          jq --version

      - name: Run tests
        run: tests/run.sh
